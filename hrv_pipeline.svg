<svg width="680" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="860" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="140" y="20" width="400" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="44" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">1 — Raw data collection</text>
  <text x="180" y="63" font-size="12" fill="#5F5E5A" dominant-baseline="central">111 PsA patients wore a smartwatch continuously,</text>
  <text x="180" y="78" font-size="12" fill="#5F5E5A" dominant-baseline="central">recording beat-to-beat heart intervals (BBI) in ms</text>

  <line x1="340" y1="94" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="140" y="124" width="400" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="148" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">2 — Select first 14 days of BBI recording</text>
  <text x="180" y="167" font-size="12" fill="#5F5E5A" dominant-baseline="central">Only the first 14 days after enrollment (T0) are used,</text>
  <text x="180" y="182" font-size="12" fill="#5F5E5A" dominant-baseline="central">aligned with the clinical visit where flare data was captured</text>

  <line x1="340" y1="198" x2="340" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="140" y="228" width="400" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="251" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">3 — Clean the signal (FLIRT rules)</text>
  <text x="180" y="270" font-size="12" fill="#534AB7" dominant-baseline="central">Smartwatch data is noisy. Implausible intervals are removed</text>
  <text x="180" y="286" font-size="12" fill="#534AB7" dominant-baseline="central">using 3 artifact-detection rules + physiological range filter</text>
  <text x="180" y="302" font-size="12" fill="#534AB7" dominant-baseline="central">(only beats between 250-2000 ms / 30-240 bpm are kept)</text>

  <line x1="340" y1="312" x2="340" y2="342" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="140" y="342" width="400" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="364" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">4 — Separate rest vs. active periods</text>
  <text x="180" y="383" font-size="12" fill="#534AB7" dominant-baseline="central">HRV naturally differs between sleep and wakefulness.</text>
  <text x="180" y="399" font-size="12" fill="#534AB7" dominant-baseline="central">To isolate the disease effect, each recording is split into</text>
  <text x="180" y="415" font-size="12" fill="#534AB7" dominant-baseline="central">low-HR (rest/sleep) and high-HR (active/wake) segments</text>

  <rect x="496" y="338" width="88" height="22" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="540" y="353" text-anchor="middle" font-size="10" fill="#633806">circadian control</text>

  <!-- Fork arrows -->
  <line x1="240" y1="438" x2="185" y2="472" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="438" x2="495" y2="472" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Low HR -->
  <rect x="60" y="472" width="250" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="185" y="496" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">Low HR - rest/sleep</text>
  <text x="185" y="516" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">BBI above 0.9 x daily avg HR</text>

  <!-- High HR -->
  <rect x="370" y="472" width="250" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="495" y="496" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C" dominant-baseline="central">High HR - active/wake</text>
  <text x="495" y="516" text-anchor="middle" font-size="12" fill="#993C1D" dominant-baseline="central">BBI below 0.9 x daily avg HR</text>

  <!-- Merge arrows -->
  <line x1="185" y1="536" x2="280" y2="578" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="536" x2="400" y2="578" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="140" y="578" width="400" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="601" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">5 — Compute HRV in sliding windows</text>
  <text x="180" y="620" font-size="12" fill="#0F6E56" dominant-baseline="central">Each segment is split into 90-min overlapping windows</text>
  <text x="180" y="636" font-size="12" fill="#0F6E56" dominant-baseline="central">(step: 30 min). Windows with too few beats are discarded.</text>
  <text x="180" y="652" font-size="12" fill="#0F6E56" dominant-baseline="central">HRV metrics computed per window, then averaged per patient</text>

  <line x1="340" y1="662" x2="340" y2="692" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="140" y="692" width="400" height="74" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="716" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">6 — One HRV profile per patient</text>
  <text x="180" y="735" font-size="12" fill="#0F6E56" dominant-baseline="central">Time-domain, frequency-domain and nonlinear HRV metrics</text>
  <text x="180" y="751" font-size="12" fill="#0F6E56" dominant-baseline="central">averaged across the 14-day window for each patient</text>

  <!-- Output fork arrows -->
  <line x1="240" y1="766" x2="185" y2="800" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="766" x2="495" y2="800" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Low results -->
  <rect x="60" y="800" width="250" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="185" y="824" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">HRV profile - rest/sleep</text>

  <!-- High results -->
  <rect x="370" y="800" width="250" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="495" y="824" text-anchor="middle" font-size="13" font-weight="500" fill="#4A1B0C" dominant-baseline="central">HRV profile - active/wake</text>

</svg>
